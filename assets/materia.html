<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<base href="../">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matéria · Diário X</title>
<link rel="icon" type="image/png" href="assets/favicon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,700;1,8..60,400&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/jornal.css">
<style>
  .topo { border-bottom: 1px solid var(--rule); }
  .topo nav { display: flex; align-items: center; justify-content: space-between; gap: 1rem; max-width: 76rem; margin: auto; padding: .75rem clamp(1rem, 5vw, 3rem); }
  .marca { font: 400 clamp(1.6rem, 4vw, 2.35rem)/1 var(--logo); text-decoration: none; }
  .voltar, .meta { font: 700 var(--t-rotulo)/1.5 var(--sans); }
  .leitura { max-width: 51rem; margin: auto; padding: clamp(2rem, 7vw, 5rem) clamp(1rem, 5vw, 3rem); overflow-wrap: anywhere; }
  .meta { display: flex; flex-wrap: wrap; gap: .4rem 1rem; color: var(--ink-3); }
  .tipo { color: var(--accent-text); text-transform: uppercase; letter-spacing: .08em; }
  h1 { margin: .6rem 0 .9rem; font: 700 clamp(2.2rem, 6vw, 4.3rem)/1.05 var(--serif); letter-spacing: -.035em; text-wrap: pretty; }
  .abertura { margin: 0 0 1.75rem; font: italic 400 clamp(1.13rem, 2.7vw, 1.35rem)/1.48 var(--serif); color: var(--ink-2); }
  figure { margin: 0 0 2rem; }
  figure img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; background: var(--paper-2); border-radius: 4px; }
  figcaption { margin-top: .35rem; color: var(--ink-3); font: 600 var(--t-rotulo)/1.4 var(--sans); }
  section { max-width: 68ch; margin-block: 1.5rem; }
  h2 { margin: 0 0 .35rem; font: 700 var(--t-titulo)/1.2 var(--serif); }
  section p { margin: 0 0 .8rem; }
  .fontes { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid var(--rule); }
  .fontes ul { margin: .5rem 0 0; padding-left: 1.25rem; }
</style>
</head>
<body>
  <header class="topo">
    <nav aria-label="Diário X">
      <a class="marca" href="./">Diário X</a>
      <a class="voltar" id="voltar" href="./">← Voltar à edição</a>
    </nav>
  </header>
  <main class="leitura" id="leitura" aria-busy="true"><p role="status">Abrindo matéria…</p></main>
  <script type="module">
    try {
      const tema = localStorage.getItem('dx-theme');
      if (tema) document.documentElement.dataset.theme = tema;
    } catch { /* segue o tema do sistema */ }

    const params = new URLSearchParams(location.search);
    const data = params.get('edicao');
    const id = params.get('id');
    const leitura = document.querySelector('#leitura');
    const voltar = document.querySelector('#voltar');
    const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (char) =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
    const externa = (url) => typeof url === 'string' && /^https?:\/\//i.test(url);
    const dataValida = /^\d{4}-\d{2}-\d{2}$/.test(data);
    if (dataValida) voltar.href = `index.html?edicao=${data}`;

    function foto(it) {
      if (!externa(it.imagem) && !/^assets\/edicoes\/\d{4}-\d{2}-\d{2}\/[a-z0-9-]+\.png$/.test(it.imagem)) return '';
      const foco = Number.isFinite(it.imagem_foco_vertical)
        ? ` style="object-position: 50% ${Math.max(0, Math.min(100, it.imagem_foco_vertical))}%"` : '';
      return `<figure><img src="${esc(it.imagem)}" alt=""${foco} decoding="async" referrerpolicy="no-referrer">
        ${it.legenda_imagem ? `<figcaption>${esc(it.legenda_imagem)}</figcaption>` : ''}</figure>`;
    }

    try {
      if (!dataValida || !id) throw new Error('Endereço incompleto');
      const resposta = await fetch(`edicoes/${data}.json`);
      if (!resposta.ok) throw new Error('Edição indisponível');
      const edicao = await resposta.json();
      const it = edicao.itens.find((item) => item.id === id);
      if (!it) throw new Error('Matéria indisponível');

      const r = it.reportagem;
      const titulo = r?.titulo || it.titulo;
      const dataLonga = new Intl.DateTimeFormat('pt-BR', { dateStyle: 'long' }).format(new Date(`${data}T12:00:00`));
      const fontes = [{ nome: it.fonte_nome, url: it.fonte_url }, ...(r?.fontes || [])].filter(({ url }) => externa(url));
      document.title = `${titulo} · Diário X`;
      leitura.innerHTML = `<article>
        <header>
          <div class="meta"><span class="tipo">${r ? 'Redação Diário X' : 'Arquivo do Diário X'}</span><time datetime="${data}">${dataLonga}</time></div>
          <h1>${esc(titulo)}</h1>
          <p class="abertura">${esc(r?.abertura || it.resumo)}</p>
        </header>
        ${foto(it)}
        ${(r?.blocos || []).map((bloco) => `<section><h2>${esc(bloco.titulo)}</h2>
          ${bloco.paragrafos.map((p) => `<p>${esc(p)}</p>`).join('')}</section>`).join('')}
        ${it.pra_voce ? `<section><h2>Pra você</h2><p>${esc(it.pra_voce)}</p></section>` : ''}
        <section class="fontes"><h2>${fontes.length > 1 ? 'Fontes' : 'Fonte'}</h2>
          <ul>${fontes.map(({ nome, url }) => `<li><a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(nome)}</a></li>`).join('')}</ul>
        </section>
      </article>`;
      const imagem = leitura.querySelector('img');
      imagem?.addEventListener('error', () => imagem.closest('figure').remove());
    } catch {
      leitura.innerHTML = '<h1>Matéria indisponível</h1><p>Confira o endereço ou volte à edição para escolher outra matéria.</p>';
    } finally {
      leitura.removeAttribute('aria-busy');
    }
  </script>
</body>
</html>
